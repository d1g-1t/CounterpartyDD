[project]
name = "counterparty-dd"
version = "0.2.0"
description = "Проверка контрагентов по праву РФ: бенефициарные владельцы по 115-ФЗ, должная осмотрительность по ст. 54.1 НК РФ, скрининг по спискам"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.143",
  "uvicorn[standard]>=0.54",
  "pydantic[email]>=2.14",
  "pydantic-settings>=2.16",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.32",
  "alembic>=1.20",
  "celery[redis]>=5.6",
  "redis>=6.4",
  "pyseto>=1.10",
  "bcrypt>=5.0",
  "structlog>=26.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.2",
  "pytest-cov>=7.0",
  "hypothesis>=6.170",
  "httpx>=0.28",
  "aiosqlite>=0.21",
  "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counterparty_dd"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE", "C4", "RUF", "ASYNC", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: требует PostgreSQL и Redis (CDD_TEST_DATABASE_URL, CDD_TEST_REDIS_URL)"]

[tool.coverage.run]
source = ["counterparty_dd"]
omit = ["*/main.py"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
